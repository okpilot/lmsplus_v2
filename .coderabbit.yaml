# yaml-language-server: $schema=https://coderabbit.ai/integrations/schema.v2.json

language: "en-US"
tone_instructions: >
  Be precise and direct. Lead with the issue, not the explanation.
  Include file path + line number. Suggest the exact fix.
  Acknowledge good patterns briefly. No fluff.

reviews:
  profile: "assertive"
  high_level_summary: true
  poem: false
  sequence_diagrams: false
  collapse_walkthrough: true
  request_changes_workflow: true

  path_filters:
    - "!**/.turbo/**"
    - "!**/node_modules/**"
    - "!**/.next/**"
    - "!**/coverage/**"
    - "!**/pnpm-lock.yaml"
    # Agent scratch space — tracker rows, counts and topic notes that agents
    # rewrite every cycle. Reviewing it burns a cloud review on markdownlint nits
    # (blank-line-after-heading, list spacing) in files no human reads as prose,
    # and it churns on almost every PR. Excluded deliberately.
    #
    # NOT excluded, on purpose: docs/**, .claude/rules/** and .claude/agents/**.
    # Those are prose too, but they are the BINDING rule surfaces — a wrong
    # sentence there propagates into future work. On PR #1174 the two most
    # valuable findings of the whole run came from exactly these files: a
    # security-auditor checklist that contradicted itself (it blocks pushes, so
    # it would have emitted false CRITICALs) and a docs/security.md claim about
    # WITH CHECK that was flatly wrong. Widen this exclusion and you lose those.
    - "!.claude/agent-memory/**"

  auto_review:
    enabled: true
    drafts: false
    ignore_title_keywords: ["WIP", "draft", "DO NOT MERGE"]

  # ── Path-specific rules (mirrors .claude/rules/code-style.md) ──────────

  path_instructions:
    # Page files — composition only, no logic
    - path: "apps/web/app/**/page.tsx"
      instructions: |
        Next.js App Router page. STRICT rules:
        - Max 80 lines. If exceeded, page has logic that belongs in _components/.
        - Pure composition: imports + one async function + JSX return. Nothing else.
        - No useState, useEffect, or event handlers.
        - Data fetching via imported async functions, not inline queries.
        - No direct Supabase client usage.
        - Props (params/searchParams) must be wrapped in Readonly<…> (SonarCloud typescript:S6759 — not Biome-enforceable).

    # App Router layouts
    - path: "apps/web/app/**/layout.tsx"
      instructions: |
        Next.js App Router layout. Enforce:
        - Props (children/params) must be wrapped in Readonly<…> (SonarCloud typescript:S6759 — not Biome-enforceable).

    # Components — single responsibility
    - path: "apps/web/app/**/_components/*.tsx"
      instructions: |
        React component. Enforce:
        - Max 150 lines. Split if exceeded.
        - Single responsibility — if description needs "and", split it.
        - No direct Supabase queries (data comes via props or Server Components).
        - No useEffect for data fetching (Next.js anti-pattern).
        - Default to Server Components. Only add 'use client' at lowest interactive boundary.
        - Functions max 30 lines, max 3 params (use options object otherwise). EXCEPTION: a React function-component / custom-hook render/return body of pure JSX composition (no branching logic, no data transformation) may reach 35 lines; flag only past 35, or at any length if the body contains non-composition logic (see code-style.md §3).
        - Max 3 nesting levels — use early returns.
        - Use Next.js <Image> instead of <img> (Biome noImgElement). Suppress only when dimensions are unknown.
        - Click handlers on static elements need paired keyboard handlers (Biome useKeyWithClickEvents).
        - Static elements must not have interaction handlers without an appropriate role (Biome noStaticElementInteractions).
        - Component props must be wrapped in Readonly<…> (immutable props contract; SonarCloud typescript:S6759 — not Biome-enforceable).

    # Shared component library (shadcn/ui + custom wrappers)
    - path: "apps/web/components/**/*.tsx"
      instructions: |
        Reusable React component. Enforce:
        - Component props must be wrapped in Readonly<…> (immutable props contract; SonarCloud typescript:S6759 — not Biome-enforceable).

    # Server Actions — validated mutations
    - path: "apps/web/app/**/actions.ts"
      instructions: |
        Server Action file. Enforce:
        - 'use server' directive at top of file.
        - Max 100 lines. Split by feature area if exceeded.
        - ALL inputs validated with Zod schema (.parse()) before use.
        - Auth check first: call requireAuth() and verify user before any mutation.
        - No service role key (adminClient) — that lives in packages/db/src/admin.ts only.
        - Explicit return types on all exported functions.
        - No `any` type — use `unknown` with narrowing.
        - Destructure { error } from ALL Supabase calls — mutations (.insert/.update/.delete/.upsert)
          AND reads (.select()) — and check it before consuming data. Supabase does not throw on query
          errors. For .single()/.maybeSingle() where "no rows" is an expected branch (e.g. first-insert
          sort_order), exempt PGRST116 explicitly (error.code !== 'PGRST116'); only a real error fails.
        - For ANY DELETE or UPDATE expected to mutate rows (RLS-scoped, admin-context, or test-cleanup),
          chain .select('id') and verify data?.length. Supabase returns 200 OK with zero rows when the
          filter matches nothing or RLS blocks — no error is thrown.
        - New query-site integration test (code-style.md §7 HARD): a NEW .from('<table>') or
          .rpc('<fn>') call site added in this file should ship a co-located *.integration.test.ts
          exercising it against the real local Postgres (the integration tier), not only a mocked-client
          unit test — mocked clients can't see the real schema. New app-layer code only; not for
          packages/db migration PRs (they have their own integration suite).

    # App-layer query helpers — same new-query-site integration-test policy (code-style.md §7 HARD)
    - path: "apps/web/lib/queries/**/*.ts"
      instructions: |
        App-layer query helper. Enforce the new-query-site integration-test policy:
        - Any NEW .from('<table>') or .rpc('<fn>') call site must ship a co-located
          *.integration.test.ts exercising it against the real local Postgres (the integration
          tier), not only mocked-client unit coverage — mocked clients can't see the real schema
          (code-style.md §7 HARD). New app-layer code only; pre-existing uncovered sites are
          tracked in the #926 backlog.

    # Hooks — small and focused
    - path: "apps/web/app/**/_hooks/use-*.ts"
      instructions: |
        Custom React hook. Enforce:
        - Max 80 lines. Extract logic to util if exceeded.
        - No useEffect for data fetching.
        - No direct Supabase calls.

    # Terminal-navigation ordering — await Server Actions before terminal navigation (code-style.md §6)
    - path: "apps/web/app/**/{_hooks,_components}/**"
      instructions: |
        Await Server Actions before terminal navigation:
        - A terminal navigation is router.push()/router.replace()/window.location.assign() to a
          different page; it must be the last statement on its path. router.refresh() is NOT
          terminal (user stays in place) — exempt.
        - Critical mutations (discardQuiz, deleteDraft) MUST be awaited before the terminal
          navigation. Sequencing them before is insufficient — a slow action's revalidation can
          cancel the pending soft-nav and strand the user (#568, #909).
        - Non-critical fire-and-forget cleanup (clearDeploymentPin) must at least be fired before
          the navigation so the navigation stays the last statement.
        - Never invoke a Server Action after a terminal navigation (router.push/replace or
          window.location.assign).

    # TypeScript — type safety
    - path: "**/*.ts"
      instructions: |
        TypeScript source. Enforce:
        - No `any` type — use `unknown` with narrowing.
        - No type casting of unvalidated external data via `as SubmitAnswerInput`.
        - When casting DB/RPC results via `as unknown as T`, pair the cast with runtime guards (Array.isArray, typeof checks, etc).
        - Fan-out/dispatch functions that switch on a discriminated question-type tag and map an optional array-valued field into a submission row must guard the field with Array.isArray(x) (route the empty array to its own branch), never a bare truthy/length check (code-style.md §5).
        - All Zod-validated inputs must use .parse() before use, not `as` casts.
        - PostgREST embedded resources MUST use `!fk_column` (FK-hint), NOT `:fk_column` (alias).
          The `:` form silently returns null on resolution failure; `!` errors loudly. Reserve `:`
          for genuine column-rename only, never as a substitute for FK expansion.
        - BIGINT / NUMERIC / DECIMAL columns from PostgREST arrive as JSON strings, not numbers.
          Coerce with Number() at the read site before any comparison, arithmetic, or method call.
          Type the wire shape as `count: number | string` to signal the coercion is required.
          Preserve null explicitly: `r.score === null ? null : Number(r.score)`.
        - All Supabase `.select()` reads must destructure { error } and check it before consuming data
          (Supabase returns 200 OK with null/[] on RLS-blocked or transport-failed reads). Server Component
          query helpers throw `Failed to fetch X: ${error.message}`; Server Actions console.error + return a
          generic message. Exempt PGRST116 (no rows) on .single()/.maybeSingle() expected-empty branches.
          Read-only test/setup helpers may wrap atomic chained reads in one try/catch.
        - HTML/SVG/XML template builders: any function building an HTML/SVG/XML string via template
          literals must escape caller-supplied or DB-derived `${...}` interpolations with an HTML-entity
          escape helper (esc() or an equivalent entity-encoder) at the interpolation site — even when
          current call sites are server-trusted (code-style.md §5).
        - Never return a raw SDK `error.message` through an exported result type — from ANY source
          (Postgres, Resend, Stripe, any third-party SDK). Log the raw error server-side (console.error)
          and return a generic domain string or a closed error-literal union (code-style.md §5).
        - Column existence on filters: flag any `.is('<column>', ...)` filter on a table whose
          schema (packages/db/src/types.ts, public.Tables.<table>.Row) lacks that column —
          most commonly `.is('deleted_at', null)` on a no-deleted_at table. PostgREST throws
          42703 at runtime while mocked tests, tsc, and Biome all pass. Mirrors the mechanical
          pre-commit guard .claude/hooks/check-soft-delete-guard.mjs (code-style.md §5).

    # Comment accuracy — deliberately spans .ts AND .tsx (see code-style.md §10, broadened
    # 2026-08-15 from DB/RPC claims to any claim). Scoping this to **/*.ts alone would miss the
    # .tsx surfaces where the defect also lands; the .sql surface is covered in the migrations
    # block below, and the binding-doc markdown surfaces in the block immediately after this one.
    - path: "**/*.{ts,tsx}"
      instructions: |
        Comment accuracy (code-style.md §10). A comment or docblock asserting behaviour the code
        does not have is worse than no comment — it is what the next reader trusts when deciding
        whether a guard can safely be removed. Flag:
        - A claim about a DB guard, grant, ownership, replay/idempotency or constraint that is not
          verified against the LATEST migration body FOR THE MATCHING SIGNATURE (trace CREATE OR
          REPLACE and DROP+CREATE, plus ALTER TABLE / CREATE [UNIQUE] INDEX, sorted by timestamp
          prefix, to HEAD). Matching the name alone can land on a body that no longer exists:
          get_report_correct_options once had (uuid[]) and (uuid, uuid[]) overloads, both dropped,
          while the live signature is (uuid).
        - When the claim rests on them, trace the functions that body CALLS, and any RLS policy,
          trigger, CHECK constraint, UNIQUE or exclusion constraint (with its backing index,
          including partial ones), or GRANT that determines the asserted behaviour. A guard can
          live outside the function body, so tracing only the function chain can certify a comment
          that a policy or trigger contradicts. Policies supersede by DROP POLICY + CREATE POLICY
          and by ALTER POLICY, which replaces TO / USING / WITH CHECK in place without recreating
          the policy — so a DROP/CREATE-only search reports a stale predicate as current.
        - A claim propagated from another doc rather than re-derived from the code. A doc is
          evidence of what someone believed, never of what the code does.
        - An ENUMERATION of an OPEN set in a comment or docblock — "the three callers", "both
          consumers", "the tables that lack deleted_at" — where the set can gain a member after
          the commit. State the derivation instead (how to find them), or mark the line as an
          as-of measurement or an explicit illustration. code-style.md §10 clause 2. A CLOSED set,
          one the code itself defines, is fine.
        - A PARTIAL comment edit — the strongest tell. When a change moves or alters code, the
          comment describing it moves too, all of it: if a diff edits any part of a comment block,
          the whole block must be re-read. A header left crediting the old file after an extraction,
          or a count left stale by lines the same commit added, are the canonical instances.
        - A count, or an "N + M" decomposition, whose terms no longer sum to the headline they
          explain. A correct total under an incomplete explanation invites the next reader to
          "correct" it back to a wrong one.

    # Comment accuracy — binding docs. code-style.md §10 governs any claim, not only code
    # comments, and its markdown instances all landed in BINDING docs (a docs/database.md grant
    # claim, a rules paragraph miscounting the commits it described). The glob ENUMERATES the
    # binding surfaces rather than taking .claude/**/*.md, which globstar-matches zero segments
    # and so would also sweep in .claude/run-log.md and .claude/agent-memory/** — write-once
    # history and tracker rows, not claims anyone reasons from. The list mirrors the set in
    # agent-workflow.md § Rule-Mirror Sync. Not a clean partition, in two ways, both harmless:
    # docs/ also holds point-in-time eval logs (docs/manual-eval-*.md) which this sweeps in, and
    # a docs/README.md would match too if one were ever added (none exists today). Reviewing
    # either costs nothing; the set is "binding docs plus a little", not the pure set.
    # .spec-workflow is included by its AUTHORITY files only, not **: steering/ plus each spec's
    # requirements.md and design.md, which § Spec Artifact Rules makes the source of truth over
    # chat history. Excluded is specs/<name>/tasks.md and the ad-hoc *plan.md / HANDOVER.md
    # trackers — same class as .claude/run-log.md and agent-memory, where rows get ticked and
    # revised in flight, so reviewing them is churn.
    - path: "{CLAUDE.md,docs/**/*.md,.claude/rules/**/*.md,.claude/commands/**/*.md,.claude/agents/**/*.md,.claude/skills/**/*.md,.claude/hooks/*.sh,.spec-workflow/steering/**/*.md,.spec-workflow/specs/**/requirements.md,.spec-workflow/specs/**/design.md}"
      instructions: |
        Comment accuracy for binding docs (code-style.md §10). These files are read as authority,
        so a wrong claim here propagates into code. Flag:
        - A claim about a DB guard, grant, column, RPC signature, policy or constraint that is not
          re-derived from the LATEST migration for the matching signature. Cite the migration.
        - A claim PROPAGATED from another doc rather than from the code. A doc is evidence of what
          someone believed, never of what the code does — this is the sharpest instance on record
          (a docs/database.md grant line nearly widened a live GRANT to anon).
        - A PARTIAL edit of a claim block. If a diff edits any part of a paragraph, table row or
          comment block, the WHOLE block must be re-read: a header left crediting the old file
          after an extraction, or a count left stale by lines the same commit added.
        - A count, or an "N + M" decomposition, whose terms no longer sum to the headline they
          explain, or which contradicts a list in the same block. The defect is INTERNAL
          INCONSISTENCY, not staleness.
          Do NOT flag a standalone inventory count (how many red-team specs, E2E specs or
          integration tests exist) for having drifted from the current file count: docs/decisions.md
          Decision 58 deliberately accepts that drift, because chasing it cost more review rounds
          than a stale number ever cost a reader who can run `ls`.
        - An ENUMERATION of an OPEN set — one that can gain a member after the commit (files in
          a directory, tables carrying a policy, issues filed on a branch, call sites matching a
          pattern). Naming its current members, or counting them, is a claim that goes silently
          false; the text must state the DERIVATION instead (a command, a query, a pointer to the
          authoritative list), or mark the line as an as-of measurement or an explicit
          illustration. code-style.md §10 clause 2. A CLOSED set — one the rule itself defines,
          or a schema fact — is fine. This is distinct from the inventory-count drift above:
          that is about not CHASING a stale number, this is about not WRITING one.
        - A rule restatement that has drifted from its source rule. Mirrors do not auto-track; a
          restatement must either carry the current mechanics or be reduced to a pointer.
        - A LITERAL COUNT of the post-commit exemptions, in digits OR in words. "the two
          exemptions", "both are defined by", "claimed neither exemption" are all counts: they go
          wrong the moment an exemption is added or removed, and this section has already gone
          stale that way. Exemptions are named, never counted.

    # Database package — security critical
    - path: "packages/db/src/**/*.ts"
      instructions: |
        Database utility (SECURITY CRITICAL). Enforce:
        - Max 200 lines.
        - SECURITY DEFINER RPCs must have manual auth.uid() check + SET search_path = public.
        - No hard DELETE anywhere — always UPDATE SET deleted_at = now().
          EXCEPTION: packages/db/src/__integration__/** teardown helpers
          (cleanupTestData/cleanupReferenceData) MAY hard-DELETE ephemeral
          per-suite fixtures — including the immutable tables audit_events /
          student_responses / quiz_session_answers — because it is the
          sanctioned service-role integration-DB reset (soft-delete can't
          reset accumulating fixtures); this is NOT production. See
          docs/database.md §3 (Soft Delete — hard-delete-by-design exception) +
          code-style.md §7. Do not flag hard DELETE in this directory; the
          "no hard DELETE" rule still applies to the rest of packages/db/src.
        - Service role key (adminClient): ONLY in packages/db/src/admin.ts. Flag if used elsewhere.
        - Never return raw question options with correct answers to student-facing code.
        - Use get_quiz_questions() RPC which strips correct answers.

    # SQL migrations — RLS mandatory
    # (supabase/migrations/ is the sole source of truth; packages/db/migrations/ is frozen/historical as of 2026-07-11)
    - path: "supabase/migrations/**/*.sql"
      instructions: |
        Database migration (SECURITY AUDIT). Enforce:
        - Header-comment accuracy (code-style.md §10). A migration header that describes how this
          body relates to an earlier one is load-bearing: this repo re-emits function bodies from a
          cited parent (migs 153/159 say so explicitly), so a header claiming "verbatim from mig X,
          only Y changed" is an instruction a future author will follow literally. If the body also
          gained a guard, a RAISE, a COALESCE or a grant, the header must say so — otherwise the
          next re-emit silently drops it. Verify such a claim by diffing the two bodies, not by
          reading the header. Flag any header claim contradicted by the body, and flag a header left
          untouched by a diff that changed the body it describes (the partial-edit tell).
        - Every CREATE TABLE must have ALTER TABLE ... ENABLE ROW LEVEL SECURITY + FORCE ROW LEVEL SECURITY.
        - RLS needs a policy for each command the table is INTENDED to permit — a command
          with no permitting policy is denied by default, so an immutable/read-only table
          carrying only a FOR SELECT policy is correct; do not flag its absent write
          policies. The clause is PER COMMAND: SELECT and DELETE take USING only;
          INSERT takes WITH CHECK only; UPDATE and FOR ALL accept both. Do not flag a
          policy for lacking a clause its command cannot carry. On UPDATE and FOR ALL,
          omitting WITH CHECK is SAFE — PostgreSQL reuses USING, so the write check then
          equals USING — do not flag that either. WITH CHECK is genuinely required only
          when the write predicate must DIFFER from the read one; flag a too-broad
          predicate, never a merely absent clause. The recognizer: a reused USING
          constrains only the columns it NAMES, so a too-broad predicate leaves every
          other column writable — that is the finding. CARVE-OUT:
          on a table that also has role-gated write policies (is_admin() etc.), the
          tenant_isolation policy MUST be declared FOR SELECT — an unqualified CREATE POLICY
          is FOR ALL, and Postgres ORs permissive policies together, so it supplies a second,
          weaker write path and the role gate never binds. A FOR SELECT policy takes USING
          only; do NOT flag it for a missing WITH CHECK. Current case: public.questions
          (20260809000100_questions_tenant_isolation_select_only.sql). (docs/security.md §3.)
        - Mutable tables must have deleted_at TIMESTAMPTZ NULL column.
        - Immutable tables (student_responses, quiz_session_answers, audit_events): no PERMITTING
          UPDATE or DELETE policy. (Each does carry permissive USING (false) policies; those match
          zero rows and are not what denies the write — the absence of a permitting policy is.)
        - audit_events is append-only. No PERMITTING UPDATE/DELETE policy. Ever. (It does carry
          audit_no_update / audit_no_delete USING (false); those match zero rows and are not the
          denial mechanism — the absence of a permitting policy is.)
        - SECURITY DEFINER functions: auth.uid() check + SET search_path = public.
        - Max 300 lines per migration file. EXCEPTION: a migration whose entire content is a
          single CREATE OR REPLACE FUNCTION (or another single, atomic, unsplittable DDL object)
          may exceed 300 lines — a plpgsql function body cannot be split across files, and our
          single-function SECURITY DEFINER RPC redefinitions run ~300-330 lines. Do NOT flag a single-function redefinition for
          length; only flag multi-statement migrations that could be split by concern. (code-style.md §1.)
        - Audit-event INSERT subqueries: every INSERT INTO audit_events block inside a
          SECURITY DEFINER function must filter deleted_at IS NULL on any user/session/
          question/membership FK lookup used to populate actor_id, actor_role, or
          session-derived columns. The outer auth guard does not cover these independent
          subqueries. Flag any INSERT INTO audit_events subquery missing AND deleted_at IS NULL.
        - Multi-policy RLS table reads: when a SECURITY INVOKER/DEFINER function reads a
          table with more than one permissive SELECT policy and returns the caller's OWN rows,
          it must scope explicitly with WHERE <owner_col> = auth.uid() (or an
          auth.uid() = p_student_id identity guard). Postgres ORs permissive policies, so RLS
          alone over-scopes to the broader instructor/admin policy. Admin/org-wide RPCs behind
          is_admin() are exempt. Flag any per-caller RPC reading SUCH a table without an
          explicit auth.uid() filter — do not limit the check to a fixed list. The set is
          derived from pg_policies (cmd IN ('SELECT','ALL'), permissive, GROUP BY tablename
          HAVING count(*) > 1) and grows with any migration adding a second read policy;
          docs/security.md §3 carries the current members, which as of 2026-05-26 were
          student_responses, quiz_sessions, exam_configs and audit_events. Note cmd 'ALL' is
          the unqualified CREATE POLICY form and permits SELECT too.
        - SECURITY DEFINER soft-delete SELECT filter: every SELECT inside a SECURITY DEFINER
          function must filter AND deleted_at IS NULL on soft-deletable tables. These functions
          are owned by postgres, which holds BYPASSRLS, so RLS is not evaluated at all and the
          soft-delete filter must be replicated manually in every query. (SECURITY DEFINER ALONE
          does not bypass RLS — it re-runs as the owner, and under FORCE ROW LEVEL SECURITY not
          even the owner is exempt; the bypass comes from the owner's BYPASSRLS attribute.) Narrow carve-out: SELECTs fetching records by IDs
          stored in an immutable, write-once column may omit the filter. Current documented cases
          (docs/security.md §15): (a) batch_submit_quiz, submit_quiz_answer, check_quiz_answer,
          check_non_mc_answer, and submit_vfr_rt_exam_answers reading
          questions via quiz_sessions.config.question_ids (written once at session start);
          (b) get_vfr_rt_exam_questions and get_vfr_rt_exam_results reading questions via the
          same frozen config.question_ids, with IDs derived server-side from the caller-owned
          session row, never from client input; (c) get_report_correct_options,
          get_admin_report_correct_options, and get_report_answer_keys reading questions via
          quiz_session_answers.question_id — a write-once FK on the immutable, append-only
          quiz_session_answers table. The write-once guarantee is enforced by
          trg_quiz_sessions_immutable_columns (mig 079). Any new carve-out
          instance must (a) cite the immutable write-once column, (b) include that citation in
          an inline comment at the call site, and (c) cross-reference docs/database.md §3
          "Scoring Soft-Deleted Questions" (per docs/security.md §15). Flag any SECURITY DEFINER
          SELECT on a soft-deletable table missing AND deleted_at IS NULL that lacks a cited
          write-once carve-out, and flag any carve-out missing the docs/database.md §3 cross-reference.
          (security.md §9 / docs/security.md §15; docs/database.md §3.)
        - Sibling SECURITY DEFINER RPC guard-set consistency: when a migration adds or
          rewrites a SECURITY DEFINER function, compare its guard set against the siblings
          in its feature family. A guard present in any sibling and absent here is a GAP.
          Especially flag a MISSING active-user / soft-deleted-caller gate — a `PERFORM 1`
          or (the common codebase form) a `SELECT … INTO … FROM users WHERE id = <uid> AND
          deleted_at IS NULL; IF NOT FOUND THEN RAISE 'user not found or inactive'` that
          also captures org_id/role — on a per-caller read/write RPC whose siblings have it; it
          leaks data/answer-keys to a deactivated account with a live JWT. Justified
          exceptions: is_admin()-gated admin/org-wide RPCs (no per-caller scoping);
          functions reading no soft-deletable table; functions with no audit_events INSERT.
          (security.md rule 12 / docs/security.md §11c; precedent #856, gaps #883.)
        - Single-active-session invariant (docs/security.md §11d): any NEW start-session RPC
          that INSERTs an active quiz_sessions row (ended_at IS NULL, any mode) must first
          soft-delete the caller's own abandoned 'discovery' row (the documented §11d
          transition), then raise 'another_session_active' when any OTHER active
          (ended_at IS NULL AND deleted_at IS NULL) session exists. The global partial unique index
          uq_one_active_session_per_student (mig 136) is the concurrent-race backstop —
          a NEW start-session RPC must carry BOTH the explicit pre-check AND an
          EXCEPTION WHEN unique_violation handler mapping violations of that index to
          'another_session_active' (the deployed pattern in the 20260629
          *_single_active_guard migrations, e.g. start_exam_session); flag a new start
          RPC missing either.
        - ON CONFLICT inference target: any INSERT ... ON CONFLICT (cols) [WHERE pred] must
          target a UNIQUE index/constraint matching those columns + predicate (a plain
          CREATE INDEX does not qualify; Postgres raises 42P10). When ON CONFLICT is inside
          a plpgsql function body, this is validated at EXECUTION, not at CREATE FUNCTION, so
          a clean migration apply does not prove correctness. Flag ON CONFLICT whose target
          is a non-unique index, and require a functional/integration test that executes the
          function. (code-style.md §5; mig 085 record_consent #386.)
        - Deferred-validation SQL in plpgsql, general case: the same apply-vs-execution gap
          covers EXECUTE format(...) and regex literals (POSIX bracket-class shorthand like
          '[][...]' is invalid in Postgres ARE — applies clean, throws 2201B on first call;
          mig 101, 2026-06-10). Flag any migration changing a plpgsql body containing these
          constructs that lacks a functional/integration test executing the function.
          (code-style.md §5 "Validate at Execution, Not Apply".)

    # Tests — behavioral naming + navigation mock URL assertions
    - path: "**/*.test.{ts,tsx}"
      instructions: |
        Test file. Enforce:
        - Test names describe behavior, not implementation.
          Good: 'schedules a shorter review interval when the answer is wrong'
          Bad: 'calls updateFsrsState'
        - Disallowed it() title patterns (impl-detail leakage) — flag these:
          - 'forwards X to <InternalName>' (camelCase or PascalCase) — names an
            internal helper, hook, or component (e.g., 'to handleSubmitSession',
            'to AnswerOptions', 'to QuizSession'). Describe the outcome instead.
          - 'from <PascalCaseType>(Opts|Config|Args)' — names an internal type.
            Describe the populated output, not the input type's name.
          - 'through <camelCaseName>(' or 'via <camelCaseName>(' — names the
            function under test; describe() already provides that context.
          - '(non-positive|typeof|isFinite|NaN) guard' — names a specific
            validator branch. Describe what input is rejected.
          - '(activates|does not activate) the guard' — internal navigation/
            validation guard machinery. Describe the user-observable consequence
            (e.g., 'does not warn when no answers exist').
          - 'matches <PascalCaseType>' (internal OR external library/standard
            type, e.g. ZodError, AuthError) — names a type instead of describing
            the result. Describe externally observable behavior (e.g. 'rejects
            invalid input'), not the type it matches.
          - 'maps <snake_case_token>' (e.g. 'maps admin_not_found', 'maps
            question_type') — names a snake_case identifier (an error code like
            an RPC RAISE/SDK code, or a DB field) instead of the user-facing
            result. Describe what the user sees, not the token.
          Permitted (these are public contracts, not impl):
          - 'calls onClick when the button is clicked' — onClick is a public prop.
          - 'calls signInWithPassword on valid submit' — public SDK method.
          - 'does not call the RPC when the input is empty' — externally
            observable side-effect.
          Borderline tiebreaker: public props, public callbacks, public SDK
          methods, and RPC names visible at the integration boundary are part
          of behavior. Internal helpers, validator branches, and private types
          are implementation.
        - Omit narrative comments above it() if the test name fully describes
          the behaviour. Comments paraphrasing the title rot when the title
          changes. Reserve comments for non-obvious WHY: hidden invariants,
          jsdom workarounds, ordering constraints.
        - When renaming a test title to be behavior-first, audit any inline
          comment inside the test body. Comments often describe an implementation
          scenario broader than the renamed (more specific) test exercises —
          drop stale comments unless they explain a non-obvious WHY.
        - Co-located with source file (same folder).
        - One test file per source file.
        - Mock external deps (Supabase, fetch), don't call real services.
        - Router mock URL assertion: any assertion on router.push / router.replace /
          redirect from next/navigation MUST check the URL/path argument, not just
          .toHaveBeenCalled(). Flag: expect(mockPush).toHaveBeenCalled() with no
          argument check. Suggest: .toHaveBeenCalledWith('/expected/path').
          Note: router.back() is zero-argument — assert the observable navigation
          result (final URL or history state), not a destination string.
        - Lifecycle integration test for feature modes: if the diff introduces a mode
          or flag branch (isExam, mode === 'X', isAdmin, etc.), verify that a lifecycle
          test exists in the diff covering entry → in-progress → exit → post-exit URL.
          Component-level toggle tests are not sufficient alone.
        - Reload test for stateful UI: if the diff adds a hook or component holding
          state in localStorage or in-memory across renders, verify a test simulates
          reload with empty local state against an active server session.
        - Paginated-fetch page-error test: any caller of fetchAllRows (or a multi-fetch
          / .range() pagination helper) must have a co-located test asserting a page-fetch
          error AFTER a successful count propagates. Two setups: (1) real helper with mocked
          queries (count succeeds with a non-zero total, first page returns { data: null, error }), or (2) fetchAllRows
          mocked as a dependency returning { data: [], error }. Assert the caller surfaces the
          error (returns { data: [], error }, throws, or logs + degrades). Guards against a
          silently-truncated result that looks complete (e.g. an incomplete GDPR export).
        - Cast-guard applies in tests too: when casting an RPC or .select() result via
          `as unknown as T` in a test helper or integration test, pair the cast with a runtime
          guard (expect(data).not.toBeNull() then cast, or Array.isArray(...) / typeof) before
          consuming the value. An unguarded cast throws an opaque TypeError on a null/shape
          regression instead of failing cleanly (code-style.md §5).
        - COALESCE/fallback-coincidence vacuity: when a test asserts a value producible by BOTH the correct-guard path AND a fallback/COALESCE default, seed a fixture whose real value differs from the fallback, or document the partial-vacuity limitation inline (code-style.md §7).
        - A test must fail if its mechanism is removed (code-style.md §7, the general form of the
          COALESCE rule above). Ask of every assertion: if the code this test exists to protect were
          deleted, would it go red? The recurring defect is a SECOND guard reaching the same result
          first, so the guard under test is never consulted — e.g. a fixture short enough that an
          unrelated length floor rejects it before the rule under test is reached, or an assertion
          checking only `error != null`, which a misspelled RPC name satisfies equally. Flag a new
          test whose fixture cannot distinguish the guard under test from an unrelated one, and
          prefer a fixture whose expected value differs from every value another guard could produce.

    # E2E Playwright specs — hermiticity (cross-spec state pollution)
    - path: "apps/web/e2e/**/*.spec.ts"
      instructions: |
        Playwright E2E spec. Enforce hermiticity — cross-spec state pollution is
        the #1 cause of CI flake-that-isn't-flake (issue #587). Specs share a
        Supabase project, so a spec mutating seed without cleanup poisons every
        downstream spec in the same project's alphabetical run order.
        - Any mutation of shared seed data (questions, students, sessions, configs)
          must restore in `test.afterEach` (or `afterAll` for describe-scoped fixtures).
          Read-only specs and specs that only mutate per-test throwaway rows tied
          to a unique marker do not need afterEach.
        - Test-created rows must carry a stable marker prefix in a queryable column
          (e.g. `question_text LIKE '[E2E_ADMIN_Q]%'`, `email LIKE 'e2e-student-mgmt-%'`).
          Marker constants must be EXPORTED from a shared helper module — flag
          inline magic strings like `'e2e-test-' + Date.now()` not anchored to a const.
        - Cleanup that touches tables with FK children must use soft-delete
          (UPDATE deleted_at = now()), not hard DELETE. FK children of `questions`:
          student_responses, quiz_session_answers, flagged_questions,
          question_comments. Hard DELETE risks 23503 violations and breaks
          docs/security.md rule 6. EXCEPTION — hard-delete-by-design tables with
          no `deleted_at` column and no FK children (`quiz_drafts` is the known case;
          decide from the table's columns, not this list, since a new such
          table joins the set silently) must
          use `.delete()`, and cleanup/count queries must NOT add
          `.is('deleted_at', null)` (the column does not exist; the cap trigger
          counts unfiltered). Soft-deleting such a table errors at runtime.
        - Cleanup helpers must chain `.select('id')` and gate logging on
          `data.length > 0` per code-style.md §5 (zero-row no-op rule). Silent
          on filter-only tests; observable when something actually changed.
        - Cleanup helpers themselves need Vitest unit tests (co-located in
          helpers/*.test.ts) covering: org-lookup error path, each mutation error
          path, no-op silence, each log path. Use the vi.hoisted + buildChain
          queue/shift pattern when the helper makes multiple sequential calls on
          the same table.
        - Multi-step cleanup blocks (`afterEach`/`afterAll` with >=2 distinct
          cleanup steps) must isolate each step in its own try/catch, accumulate
          errors (`const errors: string[] = []`, `errors.push(...)` per step),
          reset that step's tracking var/set in `finally`, and throw the joined
          errors once at the end (`if (errors.length > 0) throw ...`). A bare
          throw in step N otherwise skips steps N+1..M, leaking their rows
          downstream. For dependent steps (FK ordering — parent-delete after FK
          children, child-insert after parent — OR a data dependency on a value
          an earlier step resolved), additionally guard the dependent step with
          `errors.length === 0`. Single-step cleanups are exempt. Best-effort
          steps whose failure does NOT leak shared state (e.g. deleting a user
          that carries immutable audit_events FK refs, where the row is reused
          across runs) log-and-continue (`console.error`) instead of
          accumulating — don't make a deliberately-tolerated failure fail CI.
          Complements — does not duplicate — Biome `noUnsafeFinally`.
          (code-style.md §7)

    # Red-team specs — non-vacuous negatives + RPC output contracts (code-style.md §7)
    - path: "apps/web/e2e/redteam/**/*.spec.ts"
      instructions: |
        Red-team Playwright spec. In addition to E2E hermiticity, enforce:
        - NON-VACUOUS NEGATIVES: a negative assertion (expect(...).not.toContain(victim),
          expect(rows).toHaveLength(0), "row unchanged after a blocked mutation") must first
          assert the protected state EXISTS. For isolation tests, assert the attacker's own
          result is non-empty (expect(rows.length).toBeGreaterThan(0)) and/or the victim row
          exists via the service-role client, so "0 rows" proves RLS rejection, not an empty
          table. For state-flip/no-op tests, read the protected value before the blocked
          mutation and assert it is unchanged after. Flag negatives on unseeded tables.
        - RPC OUTPUT CONTRACTS: success/idempotent-replay specs must assert the documented
          return payload (field names + values), not just error === null. Idempotent/re-read
          paths must seed ≥2 distinct fixture values (e.g. passing 75/true AND sub-pass 50/false)
          so a hardcoded-constant regression fails at least one case. Assert numeric fields
          exact/in-bounds (0 for a zero-answer session). Flag single-fixture idempotency specs
          and unasserted numeric return fields.

    # Environment files — block immediately
    - path: "**/.env*"
      instructions: |
        CRITICAL: .env files must NEVER be committed. Block this PR immediately.
        Check for leaked secrets: API keys, service role keys, database URLs.

    # Config files
    - path: "apps/web/next.config.ts"
      instructions: |
        Check that security headers are preserved:
        - Content-Security-Policy, X-Frame-Options, X-Content-Type-Options
        - Strict-Transport-Security, Referrer-Policy, Permissions-Policy
        Flag if any security header is removed or weakened.

  # ── Pre-merge checks ───────────────────────────────────────────────────

  pre_merge_checks:
    title:
      mode: "warning"
      requirements: |
        Must follow Conventional Commits: feat:, fix:, docs:, test:, refactor:, ci:, chore:

    custom_checks:
      - mode: "error"
        name: "no-secrets"
        instructions: |
          Scan for leaked secrets in the diff:
          - Patterns: eyJ (JWT), sk_live_, service_role, sbp_, -----BEGIN, SUPABASE_SERVICE_ROLE
          - .env files committed
          - NEXT_PUBLIC_ env vars containing secret keys
          - Hardcoded Supabase URLs or API keys in source files
          In test files, ignore only explicit fake placeholder values
          (e.g., 'test-service-role-key', 'fake-key', 'mock-token').
          Continue scanning test files for all other secret patterns.
          Block if any real secret value is found.

      - mode: "error"
        name: "no-answer-exposure"
        instructions: |
          Check for correct answer exposure:
          - Direct SELECT * FROM questions or .select('*') on questions table
          - Returning raw options JSONB with correct:true to student-facing code
          - Any path that bypasses get_quiz_questions() RPC for active quiz sessions
          EXCEPTION: Post-session report queries (e.g. getQuizReport) that SELECT
          questions server-side and strip the correct field before returning to the
          client are acceptable. The student has already answered — showing the correct
          answer is intentional feedback. Verify BOTH: (1) the stripping logic removes
          `correct` from options before returning to the client, AND (2) the query
          confirms the session is completed (ended_at IS NOT NULL) before fetching
          question data. Block if either condition is missing.

      - mode: "warning"
        name: "soft-delete-only"
        instructions: |
          Flag any hard DELETE in application code or migrations on a soft-delete table;
          it must use UPDATE SET deleted_at = now() instead.
          Derive the set, do not trust a list: a table is soft-delete when it has a
          deleted_at column in packages/db/src/types.ts AND docs/database.md §3 does not
          record it as a hard-delete exception. Re-derive when a migration adds or drops
          deleted_at. As of 2026-08-20 the set was organizations, users, question_banks,
          questions, courses, lessons, quiz_sessions, flagged_questions, exam_configs,
          internal_exam_codes.
          Hard-delete-by-design (docs/database.md §3): quiz_drafts,
          exam_config_distributions, question_comments — the last of these DOES have a
          deleted_at column, so it is absent from the set above by policy, not by oversight;
          the column is an unused safety net and §3 records the exception.

