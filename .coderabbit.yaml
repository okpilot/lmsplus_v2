  tools:
    biome:
      enabled: true
    eslint:
      enabled: false
    prettier:
      enabled: false
    stylelint:
      enabled: false

  # ── Code quality overrides ─────────────────────────────────────────────

  code_quality:
    docstrings:
      enabled: false  # We use typed signatures + descriptive names instead of docstrings

