# ============================================================================
# Lefthook — Automated QA Pipeline (mechanical gates only)
# ============================================================================
#
# Layer 1: pre-commit  — BLOCKING — catches broken code before git history
# Layer 2: commit-msg  — BLOCKING — conventional commits + decisions-ledger
# Layer 3: pre-push    — BLOCKING — security gate (final defense)
#
# NOTE: Code review, doc updates, and test writing are NOT here. A commit triggers
# nothing. They run as Claude Code subagents (Agent tool) in ONE pre-push loop over
# the branch diff, so findings flow back into the conversation before the push.
# See CLAUDE.md § Pre-push review gate.
# ============================================================================

pre-commit:
  # NOT parallel: `biome-check` runs with `stage_fixed: true`, so it rewrites and RESTAGES files
  # while other commands run. `check-file-size-guard.mjs` grades the INDEX for the paths passed
  # here, so serial execution is what guarantees it sees biome's restage completed rather than
  # the pre-format blob — and its ratchet is exact-match, where a one-line difference is a
  # failure. The constraint predates the index read and survived it with its REASON changed: the
  # comment used to say the guard read the working tree, which was true until it wasn't.
  # The stage is sub-second serially; correctness wins over the saving.
  parallel: false
  commands:
    biome-check:
      glob: "*.{js,ts,jsx,tsx,json,mjs,cjs}"
      run: npx biome check --write --no-errors-on-unmatched {staged_files}
      stage_fixed: true
    type-check:
      run: pnpm check-types
    # Forbid `.is('deleted_at', …)` on tables with no deleted_at column (#925).
    # glob makes lefthook skip this when no .ts files are staged, so the script's
    # no-arg whole-tree branch is never reached from the hook.
    soft-delete-guard:
      glob: "*.{ts,tsx}"
      run: node .claude/hooks/check-soft-delete-guard.mjs {staged_files}
    # File-size limits — data in .claude/limits.json, formerly prose in code-style.md §1.
    # RATCHET, not a gate: it fails on a REGRESSION, and the failure modes are enumerated
    # canonically in code-style.md §1 — not restated here. The one that surprises: the
    # baseline match is EXACT in BOTH directions, so a recorded violation that SHRINKS
    # fails too, until `--update-baseline` records it.
    # The glob must include `sql` — the migration limit is one of the two riskiest
    # categories, and a migration-only commit would otherwise never trigger the guard.
    file-size-guard:
      # `mjs` is load-bearing: limits.json caps test files by BASENAME, so the extension is
      # an open set — and every commit of the slice that introduced this guard logged
      # "file-size-guard (skip) no files for inspection", because its own files are .mjs. The
      # guard existed and was inert at pre-commit for exactly the files it capped.
      glob: "*.{ts,tsx,sql,mjs}"
      run: node .claude/hooks/check-file-size-guard.mjs {staged_files}
    # Forbid a file path written in PROSE that does not resolve on disk (code-style.md §9,
    # "grep all docs for stale references before committing"; §10, a comment or doc asserting
    # something the code does not have). Ratcheted against `.claude/prose-paths.json`, not a
    # gate: a path that was already broken on master is baselined rather than blocking, only a
    # NEW one fails, and a baseline row whose line changed or vanished must be re-recorded.
    # NO glob: the guard enumerates its own file list from `git diff --cached` rather than taking
    # {staged_files}, and prose lives in `.md` as much as in code.
    prose-paths:
      run: node .claude/hooks/check-prose-paths.mjs
    # Forbid a new TRACKED markdown file outside .claude/md-allowlist.json (docs/decisions.md
    # Decision 85) — a maintenance note belongs in the gitignored .work/. NO glob, for the same
    # reason prose-paths has none: the guard enumerates its own staged-add/rename list.
    md-allowlist:
      run: node .claude/hooks/check-md-allowlist.mjs
    # Full test suite runs in CI (ci.yml). Pre-commit runs fast gates only.
    # test:
    #   run: pnpm test

commit-msg:
  commands:
    commitlint:
      run: npx commitlint --edit "{1}"
    # Block an edit to an existing docs/decisions.md line other than an appended marker
    # (Decision 86). Escape hatch: a `Ledger-edit-ok: <N|header> — <reason>` trailer.
    decisions-ledger:
      run: node .claude/hooks/check-decisions-ledger.mjs "{1}"

pre-push:
  parallel: true
  commands:
    security-auditor:
      run: "if [ -f .claude/hooks/run-security-auditor.sh ]; then bash .claude/hooks/run-security-auditor.sh; else echo 'run-security-auditor.sh missing — blocking push' >&2; exit 1; fi"
    audit:
      run: pnpm audit --audit-level=high
