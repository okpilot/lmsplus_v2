name: CI

on:
  pull_request:
    branches: [master]
  push:
    branches: [master]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  NODE_VERSION: '22'
  PNPM_VERSION: '9.15.0'

jobs:
  lint:
    name: Lint & Format
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0 # full history so the test-title guard (#946) can diff against the PR base
          persist-credentials: false # the guard only reads git history; no step needs write access

      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
        with:
          version: ${{ env.PNPM_VERSION }}

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      - name: Biome check (lint + format)
        run: pnpm lint

      - name: Pre-push hook verdict parser tests
        run: bash .claude/hooks/run-security-auditor.test.sh

      - name: Soft-delete column guard
        run: node .claude/hooks/check-soft-delete-guard.mjs

      - name: Soft-delete column guard — unit test
        run: node --test .claude/hooks/check-soft-delete-guard.test.mjs

      # File-size limits (.claude/limits.json). Whole-tree here, unlike the staged-file
      # pre-commit run, so a grandfathered file that grew is caught even when the commit
      # that grew it touched nothing else.
      - name: File-size guard
        run: node .claude/hooks/check-file-size-guard.mjs

      - name: File-size guard — unit test
        run: node --test .claude/hooks/check-file-size-guard.test.mjs

      # Split from the unit suite when the combined file crossed the test-file cap this
      # guard enforces. A test file nothing runs certifies its mechanism
      # unconditionally, so the split needs its own step, not just its own file.
      - name: File-size guard — CLI and live-tree tests
        run: node --test .claude/hooks/check-file-size-guard.cli.test.mjs

      # Split from the CLI suite when linking every claim to its mutation pushed it into the
      # same-commit extraction trigger again. Same requirement: its own step, or it runs nowhere.
      - name: File-size guard — stderr-trailer tests
        run: node --test .claude/hooks/check-file-size-guard.trailer.test.mjs

      # Split from the CLI suite when the staged-rename case pushed it into the same-commit
      # extraction trigger in code-style.md §1. Same reason as the split above, same
      # requirement: its own step, or the file runs nowhere.
      - name: File-size guard — argument-handling tests
        run: node --test .claude/hooks/check-file-size-guard.args.test.mjs

      - name: File-size guard — --update-baseline tests
        run: node --test .claude/hooks/check-file-size-guard.update.test.mjs

      # Split from the unit suite when the multi-entry prologue case pushed it into the same
      # trigger again. Same reason as the two splits above, same requirement: its own step.
      #
      # timeout-minutes because one case here proves TERMINATION: drop the guard's
      # unterminated-comment branch and the scan loops forever rather than answering wrong.
      # The deadline has to come from OUTSIDE the process. `node --test --test-timeout` cannot
      # do it — it is a timer on the event loop, and a synchronous busy loop never yields to
      # that loop, so the timeout callback never runs. Measured, after this step first shipped
      # with exactly that wrong flag: --test-timeout=2000 against a 12s sync loop did not fire,
      # and only an external kill ended it. A test cannot assert a hang; only something that
      # can kill the process can bound one.
      - name: File-size guard — use-server directive tests
        timeout-minutes: 5
        run: node --test .claude/hooks/check-file-size-guard.directive.test.mjs

      # §7 test-title impl-leakage guard (#946). Diff-scoped + grandfathered:
      # only titles ADDED in the PR are checked (PR events only — push to master
      # has no PR base). fetch-depth:0 above makes the base SHA available.
      - name: Test-title impl-leakage guard (PR diff, code-style.md §7)
        if: github.event_name == 'pull_request'
        run: node .claude/hooks/check-test-title-leakage.mjs --base ${{ github.event.pull_request.base.sha }}

      - name: Test-title impl-leakage guard — unit test
        run: node --test .claude/hooks/check-test-title-leakage.test.mjs

      - name: Mirror-sync checker unit tests
        run: node --test .claude/hooks/check-mirror-sync.test.mjs

      # Shared spawn-verdict helpers, imported by guard suites elsewhere in this job.
      - name: Spawn verdict helpers — unit test
        run: node --test .claude/hooks/spawn.testkit.test.mjs

      # A test nothing runs certifies its mechanism unconditionally — the same
      # defect as code-style.md §7 one level up. Enumerate with
      #   find .claude .github -name '*.test.sh' -o -name '*.test.mjs'
      # and check each against this file + lefthook.yml before adding another.
      - name: Bash guard — unit test
        run: node --test .claude/hooks/guard-bash.test.mjs

      - name: Review gate — unit test
        run: node --test .claude/hooks/review-gate.test.mjs

      - name: Commit-claims guard — unit test
        run: node --test .claude/hooks/check-commit-claims.test.mjs

      # Retracted-phrase guard (code-style.md §10 cl.3). This re-checks each commit in the
      # range exactly as the commit-msg hook did, so its value is catching commits pushed
      # with the hook bypassed — NOT a wider cross-branch analysis. Merge commits are skipped
      # (see the guard's rev-list call), so nothing here sees more than one commit at a time.
      # Each suite needs its own step — there is no aggregator.
      - name: Retracted-phrase guard (PR diff, code-style.md §10 cl.3)
        if: github.event_name == 'pull_request'
        run: node .claude/hooks/check-retracted-phrase.mjs --base ${{ github.event.pull_request.base.sha }}

      - name: Retracted-phrase guard — unit test
        run: node --test .claude/hooks/check-retracted-phrase.test.mjs

      - name: Retracted-phrase guard — git-facing tests
        run: node --test .claude/hooks/check-retracted-phrase.repo.test.mjs

      - name: Retracted-phrase guard — --base (branch-range) tests
        run: node --test .claude/hooks/check-retracted-phrase.base.test.mjs

      - name: Retracted-phrase guard — path-handling tests
        run: node --test .claude/hooks/check-retracted-phrase.paths.test.mjs

      # Prose-claims guard (code-style.md §1: limits are DATA; never restate a number in prose).
      # `--all` here, NOT the staged mode the pre-commit hook uses: CI grades the whole worktree
      # against `.claude/prose-claims.json`, so a restatement that reached master before this
      # guard existed is baselined rather than blocking, and a NEW one fails the job. This also
      # catches a baseline row whose line has since changed or gone — the same shrink-must-be-
      # recorded rule the file-size ratchet has, for the same reason: an unrecorded shrink means
      # the file and the baseline disagree about what is being graded.
      - name: Prose-claims guard (whole worktree, ratcheted)
        run: node .claude/hooks/check-prose-claims.mjs --all

      - name: Prose-claims guard — unit test
        run: node --test .claude/hooks/check-prose-claims.test.mjs

      - name: Prose-claims guard — git-facing tests
        run: node --test .claude/hooks/check-prose-claims.repo.test.mjs

      # Prose-paths guard (code-style.md §9/§10: a file path written in prose must resolve).
      # `--all` here, NOT the staged mode the pre-commit hook uses: CI grades the whole worktree
      # against `.claude/prose-paths.json`, so a path that was already broken before this guard
      # existed is baselined rather than blocking, and a NEW one fails the job. This also catches
      # a baseline row whose line has since changed or gone — the same shrink-must-be-recorded
      # rule the file-size and prose-claims ratchets have, for the same reason: an unrecorded
      # change means the file and the baseline disagree about what is being graded.
      # Each artifact needs its own step — there is no glob and no aggregator.
      - name: Prose-paths guard (whole worktree, ratcheted)
        run: node .claude/hooks/check-prose-paths.mjs --all

      - name: Prose-paths guard — unit test
        run: node --test .claude/hooks/check-prose-paths.test.mjs

      - name: Prose-paths guard — git-facing tests
        run: node --test .claude/hooks/check-prose-paths.repo.test.mjs

      # Mutation harness (Decision 67). Makes "N mutations run, N caught" RE-DERIVABLE: the
      # mutations are DATA in `<guard>.mutations.json`, applied at runtime to a throwaway worktree.
      # BOTH steps are needed and they cover different things. The unit suite pins the LOGIC that
      # decides CAUGHT/SURVIVED/MISMATCH; it never runs `modeRun` against the data files, so a
      # stale anchor, a wrong target or an under-specific `expectRed` passes it untouched. Only
      # the harness RUN grades the recipes.
      #
      # Two earlier versions of this comment argued the run did not belong in CI. Both were wrong,
      # and are recorded because the reasoning is the instructive part: the first claimed a PR
      # would "re-grade what the merge-base already proved" (false — the worktree is built from
      # HEAD, so a PR ADDING data grades it for the first time); the second claimed the unit suite
      # already covered it (false — see above, and CodeRabbit caught it). On this very branch a
      # reformat ORPHANED three anchors at count=0 and four `expectRed` sets were under-specific;
      # the unit suite was green throughout. (An earlier version of this comment credited
      # `fetch-depth: 0` for making the worktree possible — FALSE, caught by CR-local: a shallow
      # checkout also has HEAD and `git worktree add --detach <dir> HEAD` works from it. The full
      # history above is there for the test-title guard's base diff, not for this step.)
      - name: Mutation harness — unit test
        run: >-
          node --test .claude/hooks/run-mutations.test.mjs
          .claude/hooks/run-mutations.spawn.test.mjs
          .claude/hooks/run-mutations.parse.test.mjs
          .claude/hooks/run-mutations.write.test.mjs
          .claude/hooks/run-mutations.staged.test.mjs
          .claude/hooks/run-mutations.scope.test.mjs
          .claude/hooks/run-mutations.jobs.test.mjs

      # Budget, not a guess — but the basis is DATED: 7m56s in run 35345067470, before the staged,
      # scope and jobs suites joined the corpus and before `--jobs 4` parallelised grading, so that
      # figure no longer bounds this job. Re-derive from THIS workflow's own history rather than
      # trusting the number above: step timings are null in `gh run view --json jobs`; read the
      # jobs API:
      #   gh api repos/okpilot/lmsplus_v2/actions/jobs/<job_id> \
      #     --jq '.steps[] | select(.name|test("encoded mutation")) | {started_at, completed_at}'
      # Raised to 25 to absorb corpus growth between re-derivations. (`--list` is not the count —
      # it prints notEncoded entries too; `--coverage` prints the encoded count.)
      - name: Mutation harness — run every encoded mutation
        timeout-minutes: 25
        run: node .claude/hooks/run-mutations.mjs --jobs 4

      # Pipeline spec invariant (Decision 62): .claude/pipeline.json is the single
      # source for each agent's model, tools and memory, for the phase order, and
      # for every path the pipeline keys on. Supersedes agent-tools.test.mjs — the
      # access-control checks that file made are a strict subset of these.
      - name: "Pipeline spec matches the repo — unit test"
        run: node .claude/pipeline.test.mjs

  type-check:
    name: Type Check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
        with:
          version: ${{ env.PNPM_VERSION }}

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: pnpm

      - run: pnpm install --frozen-lockfile
      - run: pnpm check-types

  unit-tests:
    name: Unit Tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
        with:
          version: ${{ env.PNPM_VERSION }}

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      - name: Run Vitest with coverage
        run: pnpm coverage
        env:
          NODE_OPTIONS: '--max-old-space-size=4096'

      - name: Upload coverage reports
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        if: ${{ !cancelled() }}
        with:
          name: coverage-reports
          path: |
            apps/web/coverage/
            packages/db/coverage/
          retention-days: 14

      - name: Upload web coverage to Codecov
        if: ${{ !cancelled() }}
        uses: codecov/codecov-action@fb8b3582c8e4def4969c97caa2f19720cb33a72f # v7.0.0
        with:
          files: apps/web/coverage/lcov.info
          flags: web
          token: ${{ secrets.CODECOV_TOKEN }}
          fail_ci_if_error: false

      - name: Upload db coverage to Codecov
        if: ${{ !cancelled() }}
        uses: codecov/codecov-action@fb8b3582c8e4def4969c97caa2f19720cb33a72f # v7.0.0
        with:
          files: packages/db/coverage/lcov.info
          flags: db
          token: ${{ secrets.CODECOV_TOKEN }}
          fail_ci_if_error: false

  audit:
    name: Dependency Audit
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
        with:
          version: ${{ env.PNPM_VERSION }}

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      - name: Audit for high/critical vulnerabilities
        run: pnpm audit --audit-level=high
