name: E2E & Integration Tests

on:
  pull_request:
    branches: [master]
  push:
    branches: [master]
  schedule:
    # Run nightly at 03:00 UTC
    - cron: '0 3 * * *'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: e2e-${{ github.ref }}
  cancel-in-progress: true

env:
  NODE_VERSION: '22'
  PNPM_VERSION: '9.15.0'

jobs:
  migration-test:
    name: Migration Test (clean reset)
    runs-on: ubuntu-latest
    # Nothing bounded this before: the 2026-08-19 apt stall ran 54 min and stopped only
    # because a human cancelled it (GitHub's default job timeout is 6 h). Normal wall-clock
    # here is ~2-3 min (migration), so 30 leaves wide headroom while capping a network stall.
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: supabase/setup-cli@46f7f98c7f948ad727d22c1e67fab04c223a0520 # v3.0.0
        with:
          version: 2.78.1

      - name: Pull Supabase images from ECR Public
        # supabase/setup-cli exports SUPABASE_INTERNAL_IMAGE_REGISTRY=ghcr.io; GHCR throttles these pulls.
        run: echo "SUPABASE_INTERNAL_IMAGE_REGISTRY=public.ecr.aws" >> "$GITHUB_ENV"

      - name: Start local Supabase
        run: supabase start -x logflare,vector

      # `db reset` applies every migration and THEN restarts the storage container and probes
      # the Storage API (GET /storage/v1/bucket) to reconcile buckets against config.toml. That
      # call runs even with --no-seed and even though every [storage.buckets.*] block in
      # config.toml is commented out, and its client timeout is fixed and short (~31s measured),
      # so a slow storage restart fails the step AFTER every migration already applied cleanly.
      # Seen on runs 32246803460 (2026-08-19) and 33608609266 (2026-09-02) with a byte-identical
      # signature. Only 33608609266 is a clean self-clearing data point — it went green on an
      # unchanged re-run of the same commit; 32246803460 was never re-run at all (run_attempt 1,
      # no attempt 2). This job is a REQUIRED check, so each hit blocks a merge by hand.
      #
      # Retry ONCE, and only when both halves of the signature land on ONE line — the shape the
      # CLI actually emits (`… Get "…/storage/v1/bucket": context deadline exceeded …`). Two
      # independent greps would also fire on a log that merely mentions both somewhere. Every
      # other failure exits on the first attempt, so a genuine migration error still fails
      # fast: a SQL error cannot emit this string — it is a Go HTTP-client timeout the CLI
      # prints only after the last migration.
      # The readiness gate is cheap and can only delay (never skip) an attempt, but
      # /storage/v1/status is a liveness probe while /bucket is DB-backed — how much the gate
      # actually de-risks the retry is unverified. The retry is the fix; the gate is belt.
      # /bucket itself is unusable as the probe: it answers 400 without an apikey.
      - name: Reset DB (apply all migrations from scratch)
        env:
          SUPABASE_HEALTH_URL: http://localhost:54321/storage/v1/status
        run: |
          # `pipefail` is load-bearing, not decoration: the default `run:` shell is `bash -e {0}`
          # with NO pipefail, and `tee` almost always exits 0 — so without it the `if` below reads
          # tee's status and every FAILED reset looks like a success. `-e` is already on, but it
          # does NOT propagate out of an if/else branch, which is why each branch exits explicitly.
          set -uo pipefail
          for attempt in 1 2; do
            bash .github/scripts/wait-for-supabase.sh
            if supabase db reset --no-seed 2>&1 | tee /tmp/db-reset.log; then
              exit 0
            fi
            if [ "$attempt" -eq 2 ]; then
              echo "::error::supabase db reset failed on the retry"
              exit 1
            fi
            if ! grep -qE 'storage/v1/bucket.*context deadline exceeded' /tmp/db-reset.log; then
              echo "::error::supabase db reset failed (not the storage-timeout flake) — not retrying"
              exit 1
            fi
            echo "::warning::Storage API probe timed out during db reset — retrying once"
          done
          # Unreachable: every path above exits. Fail closed if that ever stops being true.
          exit 1

      - name: Verify all migrations applied
        run: |
          set -e
          EXPECTED=$(ls supabase/migrations/*.sql | wc -l | tr -d ' ')
          ACTUAL=$(PGPASSWORD=postgres psql -h localhost -p 54322 -U postgres -d postgres -t -c \
            "SELECT count(*) FROM supabase_migrations.schema_migrations;" | tr -d ' ')
          echo "Expected: $EXPECTED | Applied: $ACTUAL"
          if [ "$ACTUAL" -ne "$EXPECTED" ]; then
            echo "ERROR: Migration count mismatch"
            exit 1
          fi

      # Fails if anon holds ANY table privilege, or authenticated's INSERT/UPDATE/DELETE
      # set diverges (either direction) from the mig 20260925000300 kept allowlist, or
      # authenticated holds TRUNCATE/REFERENCES/TRIGGER/MAINTAIN, on any public relation
      # or postgres default privilege.
      - name: Verify anon/authenticated table privileges match least-privilege grants
        run: |
          set -euo pipefail
          ROWS=$(PGPASSWORD=postgres psql -h localhost -p 54322 -U postgres -d postgres -tA -F' | ' -c "
            WITH allow(relname, priv) AS (
              VALUES
                ('easa_subjects','INSERT'), ('easa_subjects','UPDATE'), ('easa_subjects','DELETE'),
                ('easa_topics','INSERT'), ('easa_topics','UPDATE'), ('easa_topics','DELETE'),
                ('easa_subtopics','INSERT'), ('easa_subtopics','UPDATE'), ('easa_subtopics','DELETE'),
                ('exam_configs','INSERT'), ('exam_configs','UPDATE'),
                ('exam_config_distributions','INSERT'), ('exam_config_distributions','DELETE'),
                ('flagged_questions','INSERT'), ('flagged_questions','UPDATE'),
                ('fsrs_cards','INSERT'), ('fsrs_cards','UPDATE'), ('fsrs_cards','DELETE'),
                ('quiz_drafts','INSERT'), ('quiz_drafts','UPDATE'), ('quiz_drafts','DELETE'),
                ('question_comments','INSERT'), ('question_comments','DELETE'),
                ('questions','INSERT'), ('questions','UPDATE'),
                ('quiz_sessions','INSERT'), ('quiz_sessions','UPDATE'),
                ('users','UPDATE')
            ),
            relations AS (
              SELECT c.oid, c.relname, c.relkind
              FROM pg_class c
              JOIN pg_namespace n ON n.oid = c.relnamespace
              WHERE n.nspname = 'public' AND c.relkind IN ('r','p','v','m')
            ),
            anon_bad AS (
              SELECT relname, relkind::text, 'anon'::text AS grantee, v.priv
              FROM relations
              CROSS JOIN LATERAL (VALUES ('SELECT'),('INSERT'),('UPDATE'),('DELETE'),
                                          ('TRUNCATE'),('REFERENCES'),('TRIGGER'),('MAINTAIN')) AS v(priv)
              WHERE has_table_privilege('anon', oid, v.priv)
                 OR (CASE WHEN v.priv IN ('SELECT','INSERT','UPDATE','REFERENCES')
                          THEN has_any_column_privilege('anon', oid, v.priv) ELSE false END)
            ),
            auth_observed AS (
              SELECT relname, relkind, v.priv,
                (has_table_privilege('authenticated', oid, v.priv)
                 OR (CASE WHEN v.priv IN ('INSERT','UPDATE')
                          THEN has_any_column_privilege('authenticated', oid, v.priv) ELSE false END)) AS held
              FROM relations
              CROSS JOIN LATERAL (VALUES ('INSERT'),('UPDATE'),('DELETE')) AS v(priv)
            ),
            auth_extra AS (
              SELECT relname, relkind::text, 'authenticated'::text AS grantee, priv
              FROM auth_observed o
              WHERE held AND NOT EXISTS (SELECT 1 FROM allow a WHERE a.relname = o.relname AND a.priv = o.priv)
            ),
            auth_missing AS (
              SELECT a.relname, NULL::text AS relkind, 'authenticated'::text AS grantee, a.priv
              FROM allow a
              LEFT JOIN auth_observed o ON o.relname = a.relname AND o.priv = a.priv
              WHERE COALESCE(o.held, false) = false
            ),
            auth_forbidden AS (
              SELECT relname, relkind::text, 'authenticated'::text AS grantee, v.priv
              FROM relations
              CROSS JOIN LATERAL (VALUES ('TRUNCATE'),('REFERENCES'),('TRIGGER'),('MAINTAIN')) AS v(priv)
              WHERE has_table_privilege('authenticated', oid, v.priv)
            ),
            bad_defaults AS (
              SELECT da.defaclobjtype, grantee_role.rolname AS grantee, acl.privilege_type
              FROM pg_default_acl da
              JOIN pg_roles owner ON owner.oid = da.defaclrole
              LEFT JOIN pg_namespace n ON n.oid = da.defaclnamespace
              CROSS JOIN LATERAL aclexplode(da.defaclacl) AS acl(grantor, grantee, privilege_type, grantable)
              JOIN pg_roles grantee_role ON grantee_role.oid = acl.grantee
              WHERE owner.rolname = 'postgres'
                AND (n.nspname = 'public' OR da.defaclnamespace = 0)
                AND (
                  (grantee_role.rolname = 'anon' AND da.defaclobjtype IN ('r','S'))
                  OR (grantee_role.rolname = 'authenticated' AND da.defaclobjtype = 'r' AND acl.privilege_type <> 'SELECT')
                )
            )
            SELECT 'anon_bad' AS kind, relname, relkind, grantee, priv FROM anon_bad
            UNION ALL
            SELECT 'auth_extra', relname, relkind, grantee, priv FROM auth_extra
            UNION ALL
            SELECT 'auth_missing', relname, relkind, grantee, priv FROM auth_missing
            UNION ALL
            SELECT 'auth_forbidden', relname, relkind, grantee, priv FROM auth_forbidden
            UNION ALL
            SELECT 'bad_default', defaclobjtype::text, NULL, grantee, privilege_type FROM bad_defaults;
          ")

          TABLE_COUNT=$(PGPASSWORD=postgres psql -h localhost -p 54322 -U postgres -d postgres -tAc "
            SELECT count(*) FROM pg_class c JOIN pg_namespace n ON n.oid = c.relnamespace
              WHERE n.nspname = 'public' AND c.relkind IN ('r','p','v','m');
          ")
          AUTH_CAN_SELECT_USERS=$(PGPASSWORD=postgres psql -h localhost -p 54322 -U postgres -d postgres -tAc "
            SELECT has_table_privilege('authenticated', 'public.users', 'SELECT');
          ")

          if [ "$TABLE_COUNT" -le 0 ]; then
            echo "::error::Non-vacuity check failed — public schema reports 0 tables/views"
            exit 1
          fi
          if [ "$AUTH_CAN_SELECT_USERS" != "t" ]; then
            echo "::error::Non-vacuity check failed — authenticated lost SELECT on public.users (query is too broad)"
            exit 1
          fi

          if [ -n "$ROWS" ]; then
            echo "::error::anon/authenticated table privileges diverge from the least-privilege grants:"
            echo "$ROWS"
            exit 1
          fi
          echo "OK: anon holds no table privilege, authenticated's INSERT/UPDATE/DELETE set matches the kept allowlist exactly and holds no TRUNCATE/REFERENCES/TRIGGER/MAINTAIN, on any public table/view or default privilege ($TABLE_COUNT tables/views checked)"

  integration-tests:
    name: Integration Tests (Supabase)
    runs-on: ubuntu-latest
    # Nothing bounded this before: the 2026-08-19 apt stall ran 54 min and stopped only
    # because a human cancelled it (GitHub's default job timeout is 6 h). Normal wall-clock
    # here is ~3-4 min (integration), so 30 leaves wide headroom while capping a network stall.
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: supabase/setup-cli@46f7f98c7f948ad727d22c1e67fab04c223a0520 # v3.0.0
        with:
          version: 2.78.1

      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
        with:
          version: ${{ env.PNPM_VERSION }}

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      - name: Pull Supabase images from ECR Public
        # supabase/setup-cli exports SUPABASE_INTERNAL_IMAGE_REGISTRY=ghcr.io; GHCR throttles these pulls.
        run: echo "SUPABASE_INTERNAL_IMAGE_REGISTRY=public.ecr.aws" >> "$GITHUB_ENV"

      - name: Start local Supabase
        run: supabase start -x logflare,vector

      - name: Wait for Supabase readiness
        run: bash .github/scripts/wait-for-supabase.sh

      - name: Export Supabase env vars
        run: |
          eval "$(supabase status -o env)"
          echo "NEXT_PUBLIC_SUPABASE_URL=${API_URL}" >> $GITHUB_ENV
          echo "NEXT_PUBLIC_SUPABASE_ANON_KEY=${ANON_KEY}" >> $GITHUB_ENV
          echo "SUPABASE_SERVICE_ROLE_KEY=${SERVICE_ROLE_KEY}" >> $GITHUB_ENV

      - name: Type-check integration tests
        run: pnpm --filter @repo/db check-types:integration

      - name: Run integration tests
        run: pnpm --filter @repo/db test:integration

      # App-layer integration tier (#925): real apps/web query helpers + Server
      # Actions against the same already-running Supabase container.
      - name: Type-check app-layer integration tests
        run: pnpm --filter @repo/web check-types:integration

      - name: Run app-layer integration tests
        run: pnpm --filter @repo/web test:integration

  e2e-tests:
    name: E2E Tests (Playwright)
    runs-on: ubuntu-latest
    # Nothing bounded this before: the 2026-08-19 apt stall ran 54 min and stopped only
    # because a human cancelled it (GitHub's default job timeout is 6 h). Normal wall-clock
    # here is ~7-9 min (the Playwright suite), so 30 leaves wide headroom while capping a stall.
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: supabase/setup-cli@46f7f98c7f948ad727d22c1e67fab04c223a0520 # v3.0.0
        with:
          version: 2.78.1

      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
        with:
          version: ${{ env.PNPM_VERSION }}

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      - name: Install Playwright browsers
        # No --with-deps: it runs `apt-get update` first, which drags an Ubuntu mirror we do
        # not control into the critical path. On 2026-08-19 that mirror
        # (azure.archive.ubuntu.com) returned `Ign:` for all 26 of its requests; apt failed over
        # to archive.ubuntu.com, logged the start of three more InRelease fetches at 07:58:16,
        # and printed nothing further -- no `Fetched ... in` summary, no package install, no
        # browser download -- until the job was cancelled ~53 min later. Not an outage: of the
        # two jobs running this same command in that window, one hung and one passed in ~6 min,
        # so it is per-runner.
        # ubuntu-latest preinstalls Chrome and Edge, whose deb dependencies cover Playwright's
        # chromium library set, so the flag mainly bought that mirror dependency (plus a `tools`
        # group of fonts and xvfb that no spec here uses -- no screenshot/snapshot assertions,
        # headless only).
        run: pnpm --filter @repo/web exec playwright install chromium

      - name: Pull Supabase images from ECR Public
        # supabase/setup-cli exports SUPABASE_INTERNAL_IMAGE_REGISTRY=ghcr.io; GHCR throttles these pulls.
        run: echo "SUPABASE_INTERNAL_IMAGE_REGISTRY=public.ecr.aws" >> "$GITHUB_ENV"

      - name: Start local Supabase
        run: supabase start -x logflare,vector

      - name: Wait for Supabase readiness
        run: bash .github/scripts/wait-for-supabase.sh

      - name: Export Supabase env vars
        run: |
          eval "$(supabase status -o env)"
          # Use localhost (not 127.0.0.1) — Chromium treats them as different origins
          echo "NEXT_PUBLIC_SUPABASE_URL=http://localhost:54321" >> $GITHUB_ENV
          echo "NEXT_PUBLIC_SUPABASE_ANON_KEY=${ANON_KEY}" >> $GITHUB_ENV
          echo "SUPABASE_SERVICE_ROLE_KEY=${SERVICE_ROLE_KEY}" >> $GITHUB_ENV
          # Server Actions (e.g. sendInternalExamCodeEmail) read this at runtime to build app links;
          # must equal the Playwright baseURL so the email path runs instead of erroring out.
          echo "NEXT_PUBLIC_APP_URL=http://localhost:3000" >> $GITHUB_ENV

      - name: Write .env.local for Next.js
        run: |
          printf '%s\n' \
            "NEXT_PUBLIC_SUPABASE_URL=${NEXT_PUBLIC_SUPABASE_URL}" \
            "NEXT_PUBLIC_SUPABASE_ANON_KEY=${NEXT_PUBLIC_SUPABASE_ANON_KEY}" \
            "SUPABASE_SERVICE_ROLE_KEY=${SUPABASE_SERVICE_ROLE_KEY}" \
            "NEXT_PUBLIC_APP_URL=${NEXT_PUBLIC_APP_URL}" \
            > apps/web/.env.local

      - name: Seed test data
        run: pnpm --filter @repo/web exec tsx scripts/seed-e2e.ts

      - name: Build app
        run: pnpm build

      - name: Run Playwright tests
        run: pnpm --filter @repo/web e2e

      - name: Upload Playwright report
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        if: ${{ !cancelled() }}
        with:
          name: playwright-report
          path: apps/web/playwright-report/
          retention-days: 14

      - name: Upload test results
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        if: ${{ !cancelled() }}
        with:
          name: test-results
          path: apps/web/test-results/
          retention-days: 7
