name: Probe Model
on:
  pull_request:
    branches: [master]
permissions:
  contents: read
jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      CLAUDE_CODE_OAUTH_TOKEN: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
    steps:
      - uses: anthropics/claude-code-action@9ca9355b36297178e28d37c799d1c9c8a28e6507
        continue-on-error: true
        with:
          github_token: ${{ github.token }}
          prompt: "Reply with the single word OK."
          show_full_output: true
          claude_args: --model claude-opus-5-5 --disallowedTools "Bash"
      - uses: anthropics/claude-code-action@9ca9355b36297178e28d37c799d1c9c8a28e6507
        continue-on-error: true
        with:
          github_token: ${{ github.token }}
          prompt: "Reply with the single word OK."
          show_full_output: true
          claude_args: --model claude-opus-5 --disallowedTools "Bash"
