name: Stale Issues

on:
  schedule:
    - cron: '30 8 * * 0' # Sunday 08:30 UTC
  workflow_dispatch:

permissions:
  issues: write

jobs:
  stale:
    name: Label & Close Stale Issues
    runs-on: ubuntu-latest
    steps:
      - uses: actions/stale@4391f3da665fdf50b6810c1a66712fb9ba21aa93 # v11.0.0
        with:
          only: 'issues'
          days-before-stale: 30
          days-before-close: 30
          close-issue-reason: 'not_planned'
          stale-issue-label: 'stale'
          stale-issue-message: >
            This issue has had no activity for 30 days and has been marked as stale.
            It will be closed in 30 more days if no further activity occurs.
            If this is still relevant, please leave a comment or update the issue.
          close-issue-message: >
            This issue has been automatically closed after 60 days of inactivity.
            If you believe this is still relevant, please open a new issue with updated context.
          # `ops` and `product-decision` mark work that no PR can ever close — a DNS record,
          # a vendor tier, a compliance document, a token rotation, a product scoping call.
          # Without the exemption the bot closes them on the 60-day clock and they get
          # reopened by hand: #187, #189, #369 and #370 have each been through that cycle
          # once already (closed 2026-07-12, reopened 2026-07-23). Inactivity is the normal
          # resting state for these, not a signal that they are stale.
          exempt-issue-labels: 'P0 - Critical,bug,security,ops,product-decision'
          operations-per-run: 100
