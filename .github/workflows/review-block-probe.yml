name: Review block probe
on:
  pull_request:
    branches: [master]
permissions:
  contents: read
  pull-requests: write
jobs:
  probe:
    runs-on: ubuntu-latest
    steps:
      - run: gh pr review "${{ github.event.pull_request.number }}" --repo "${{ github.repository }}" --request-changes --body "probe: does a github-actions REQUEST_CHANGES block the merge?"
        env:
          GH_TOKEN: ${{ github.token }}
